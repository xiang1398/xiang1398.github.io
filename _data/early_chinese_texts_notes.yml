n013:
  - |
    **《釋名》의 성훈(聲訓):** 爾를 昵으로 풀이하는 방식은 음이 비슷한 글자를 이용해 뜻을 설명하는 전통적 성훈이다. 현대 역사언어학적 어원 분석과는 방법론이 다르므로, 이를 곧바로 爾의 실제 어원으로 이해해서는 안 된다.
  - |
    **19편과 20편의 차이:** 《漢書·藝文志》는 《爾雅》를 3권 20편으로 기록하지만 현전본은 19편이다. 전승 과정의 편차 문제로, 현전 〈釋詁〉의 분합과 관련지어 설명하기도 하나 확정된 해답은 없다.
  - |
    **敦煌 잔편:** *Fonds Pelliot Chinois*는 프랑스 국립도서관 소장 敦煌 한문문서의 펠리오 컬렉션 청구기호이다.

n014:
  - |
    **서명의 法:** 《法言》의 法은 현대어의 ‘법률’에 한정되지 않는다. 여기서는 본받을 만한 전범·준칙이라는 뜻이 중심이므로, 서명은 ‘모범이 되는 말’ 정도로 이해하는 것이 적절하다.
  - |
    **神과 先知:** 이 문맥의 神은 인격신을 가리킨다기보다 사물의 이치를 꿰뚫어 아는 신묘한 정신적 능력에 가깝다. 따라서 先知 역시 종교적 예언이라기보다 앞서 알아차리는 통찰의 의미로 읽는 편이 자연스럽다.
  - |
    **漢 210년:** 揚雄이 말한 210년은 계산의 기점을 어디에 두느냐에 따라 해석이 달라질 수 있다. 본문은 劉邦의 황제 즉위인 기원전 202년을 기점으로 보는 해석을 따른다.

n015:
  - |
    **風俗의 범위:** 여기서 風俗은 현대의 ‘민속’보다 넓다. 사회의 관습·신앙·의례·통념과 지역적 습속 전반을 포괄하는 말로 이해할 필요가 있다.
  - |
    **31권·32권 문제:** 《隋書》 현전본의 31권 기록과 蘇頌이 보았다는 32권 기록의 차이는 단순 오자가 아니라 실제 전승 과정의 권수 변화일 가능성이 있다. 蘇頌은 본문 31권에 錄 1권을 더한 체계를 상정하였다.
  - |
    **逸文:** ‘일문(逸文)’은 현전본에서는 사라졌지만 다른 문헌의 인용을 통해 보존된 구절을 말한다. 《風俗通義》처럼 대량의 권질이 소실된 문헌에서는 일문 수집이 본문 복원의 핵심 자료가 된다.

n016:
  - |
    **紀라는 형식:** 《漢紀》의 紀는 사건을 연대순으로 엮는 편년체적 서술을 뜻한다. 이는 本紀·列傳·志 등을 항목별로 나누는 《漢書》의 기전체 구조를 다시 시간 순서로 재배열한 점과 관련된다.
  - |
    **荀悅의 〈論〉:** 본문 사이의 〈論〉은 단순한 요약이 아니라 荀悅 자신의 역사적·정치적 판단을 드러내는 논평이다. 《漢書》를 축약하면서도 저자의 해석이 개입되는 지점이다.
  - |
    **종이에 썼다는 기록:** 荀悅의 서문에서 종이를 사용했다고 한 대목은 後漢 말 필사문화의 변화를 보여 주는 흥미로운 증언이다. 다만 이 시기에도 죽간·목간과 종이는 병용되었으므로 종이가 이미 완전히 대체재가 되었다는 뜻은 아니다.

n017:
  - |
    **法·術·勢:** 세 용어는 후대에 韓非 사상을 요약하는 핵심 개념으로 자주 함께 제시된다. 法은 공개된 규범과 법제, 術은 군주가 신하를 통제·평가하는 통치 기술, 勢는 개인적 덕목과 별개로 지위 자체에서 생기는 권세를 가리킨다. 세 개념의 결합을 하나의 고정된 ‘삼분법’으로 체계화하는 것은 근대 연구의 설명 방식이라는 점도 유의할 필요가 있다.
  - |
    **《韓子》와 《韓非子》:** 漢代 서지에서는 《韓子》라는 제목이 쓰였으나, 唐代 이후 韓愈와의 혼동을 피하기 위해 《韓非子》라는 명칭이 일반화되었다.
  - |
    **‘一曰’ 구절:** 內外儲說의 ‘一曰’은 같은 논점을 다른 일화나 설명으로 다시 제시하는 표지이다. 일부 연구자는 이를 후대 첨입의 흔적으로 보았지만, 현 단계에서 모든 ‘一曰’을 일괄적으로 후대 주석으로 처리할 확실한 근거는 없다.

n018:
  - |
    **外傳의 의미:** 《韓詩外傳》의 外傳은 현대어의 ‘외전’처럼 본편 밖의 부록이나 속편이라는 뜻으로 이해하면 곤란하다. 漢代 韓詩 학파의 전승 자료 가운데 하나를 가리키는 전통적 서명이며, 현전본은 《詩經》 자체의 주석서라기보다 시구의 실제 활용 사례를 모은 편찬물에 가깝다.
  - |
    **三家詩:** 漢代에 관학으로 전승된 魯詩·齊詩·韓詩를 통칭한다. 이 세 학파의 완전한 텍스트는 후대에 대부분 소실되었고, 오늘날 통행하는 《詩經》 전승은 毛詩 계통이다.
  - |
    **內傳·外傳 합병설:** 《漢書》는 韓嬰의 《外傳》 6권과 《內傳》 4권을 별도로 기록한다. 楊樹達 이후 현전 10권본이 두 계통의 자료를 합친 결과라는 견해가 제기되었으나, 단순한 기계적 합본이라기보다 재편집 과정을 거쳤을 가능성이 크다.
