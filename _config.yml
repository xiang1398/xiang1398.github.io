title: 孜山의 서재
description: 고전 문헌 · 역사언어학 · 번역 노트
url: "https://xiang1398.github.io"
theme: minima
markdown: kramdown
highlighter: rouge

header_pages:
  - categories.md
  - search.md
  - tags.md
  - stats.md

kramdown:
  input: GFM
  footnote_nr: 1

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: "_posts/2023-02-26-kongcongzi-01-jiayan.md"
      type: posts
    values:
      hidden: true
      published: false
      sitemap: false
  - scope:
      path: "_posts/2023-06-16-kongcongzi-02-lunshu.md"
      type: posts
    values:
      hidden: true
      published: false
      sitemap: false
