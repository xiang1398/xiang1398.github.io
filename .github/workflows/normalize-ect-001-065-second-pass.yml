name: Normalize ECT 001-065 second editorial pass
on:
  push:
    paths:
      - '.github/workflows/normalize-ect-001-065-second-pass.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Normalize ECT 001-065
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          notice='*이 번역문은 GPT-5.6 모델로 기계번역한 뒤 편집·교정한 것입니다.*'
          nr=re.compile(r'(?m)^\*{0,2}이 번역문은 GPT-5\.6 모델로 기계번역한 뒤 편집·교정한 것입니다\.?\*{0,2}$')
          title_re=re.compile(r'title:\s*["\']?《Early Chinese Texts》\s+(\d{3}):')

          explicit={
            'The Early History of the Chou Li and Tso Chuan Texts, *BMFEA*':'“The Early History of the Chou Li and Tso Chuan Texts,” *BMFEA*',
            'On the Authenticity and Nature of the Tso-chuan, *Göteborgs Högskolas Årsskrift*':'“On the Authenticity and Nature of the Tso-chuan,” *Göteborgs Högskolas Årsskrift*',
            'The Early History of the Chou li and Tso chuan Texts, *Bulletin of the Museum of Far Eastern Antiquities*':'“The Early History of the Chou li and Tso chuan Texts,” *Bulletin of the Museum of Far Eastern Antiquities*',
            'La composition et la date du Tso-chuan [《左傳》의 성립과 연대], *Mélanges chinois et bouddhiques*':'“La composition et la date du Tso-chuan” [《左傳》의 성립과 연대], *Mélanges chinois et bouddhiques*',
            'Notes on New Studies on Tung Chung-shu, *Archiv Orientální*':'“Notes on New Studies on Tung Chung-shu,” *Archiv Orientální*',
            'The Canon of Laws by Li K’uei—A Double Falsification, *Archiv Orientální*':'“The Canon of Laws by Li K’uei—A Double Falsification,” *Archiv Orientální*',
            'The Life of Huan T’an, *Archiv Orientální*':'“The Life of Huan T’an,” *Archiv Orientální*',
            '(On the Authenticity and Nature of the Tso chuan, *Göteborgs Högskolas Årsskrift*':'(“On the Authenticity and Nature of the Tso chuan,” *Göteborgs Högskolas Årsskrift*',
            'Karlgren, “Bernhard,” *Glosses on the Book of Documents* II':'Karlgren, Bernhard, *Glosses on the Book of Documents* II',
          }

          for p in sorted(Path('_posts').glob('*early-chinese-texts-*.md')):
            t=p.read_text(encoding='utf-8')
            m=title_re.search(t[:800])
            if not m or not (1 <= int(m.group(1)) <= 65):
              continue
            old=t
            t=nr.sub(notice,t)
            t=t.replace('(역자 주: 〈日本國見在書目錄〉)','(역자 주: 《日本國見在書目錄》)')
            t=re.sub(r'(《[^》]+》\s*卷\d+(?:上|下)?),\s+(pp?\.)',r'\1 \2',t)
            t=re.sub(r'(?<![A-Za-z])(卷\d+(?:上|下)?),\s+(pp?\.)',r'\1 \2',t)
            t=re.sub(r'(《[^》]+》)\s*권(?=\d)',r'\1 卷',t)
            t=re.sub(r'(?m)^(\s*)\\\(([A-Za-z]|[ivxlcdmIVXLCDM]+)\\\)(\s+)',r'\1(\2)\3',t)
            # Curly-quote punctuation before italic Western journal names.
            t=re.sub(r'“([^”\n]+)”\s*,\s*(\*[^*\n]+\*)',r'“\1,” \2',t)
            t=re.sub(r'“([^”\n]+)”,\s*(\*[^*\n]+\*)',r'“\1,” \2',t)
            # CJK journal titles: 〈article〉, 《journal》.
            t=re.sub(r'(〈[^〉\n]+〉,\s*)\*([\u3400-\u9fff][^*\n]*)\*',r'\1《\2》',t)
            # Normalize author-signature lines only when the whole line is a signature.
            t=re.sub(r'(?m)^\s*—\s*([^\n*]+?)\s*$',lambda m:'*—'+m.group(1).strip()+'*',t)
            t=re.sub(r'(?m)^\s*—\s*\*([^\n]+?)\*\s*$',lambda m:'*—'+m.group(1).replace('*','').strip()+'*',t)
            for a,b in explicit.items():
              t=t.replace(a,b)
            if t!=old:
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- _posts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Second-pass normalize ECT 001-065 editorial style'
          git push
