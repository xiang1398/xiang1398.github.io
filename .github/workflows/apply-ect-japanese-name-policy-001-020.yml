name: Apply ECT 001-020 Japanese name policy
on:
  push:
    paths:
      - '.github/workflows/apply-ect-japanese-name-policy-001-020.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize Japanese scholar names
        run: python tools/apply_ect_japanese_name_policy_001_020.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Apply Japanese name policy to ECT 001-020'
            git push
          fi
