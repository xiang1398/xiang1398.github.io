name: Normalize ECT 001-065 microstyle
on:
  push:
    paths:
      - '.github/workflows/normalize-ect-microstyle.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize requested microstyle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=sorted(Path('_posts').glob('*early-chinese-texts-*.md'))
          for p in files:
              s=p.read_text(encoding='utf-8')
              # Initials: D.C. -> D. C.; A.F.P. -> A. F. P., etc. (Latin initials only)
              s=re.sub(r'(?<![A-Za-z])((?:[A-Z]\.){2,})(?=\s*[A-Z][A-Za-zÀ-ÖØ-öø-ÿ’\'-])',
                       lambda m: ' '.join(re.findall(r'[A-Z]\.',m.group(1))), s)
              # Requested ICS house style.
              s=re.sub(r'(?<![A-Za-z*])\*?ICS\*?\s*(?:총서|series)', '*ICS* series', s, flags=re.I)
              # Place of publication for ICS/concordance bibliography: Korean/Chinese Hong Kong forms -> Hong Kong.
              lines=[]
              for line in s.splitlines(True):
                  if ('*ICS* series' in line or 'Concordance' in line) and ('商務印書館' in line or 'Commercial Press' in line):
                      line=re.sub(r'(?:홍콩|香港)(?=\s*:|\s+商務印書館)', 'Hong Kong', line)
                  # Journal volume/issue: 39.1 / 9.3 -> 39:1 / 9:3 (only bibliography-like lines).
                  if any(k in line for k in ['pp.', 'p.', '《', '*Bulletin', '*Journal', '*Early China', '*Monumenta', '*T’oung', '*Harvard', '*Asia Major', '*Sinica']):
                      line=re.sub(r'(?<!\d)(\d{1,3})\.(\d{1,2})(?=\s*\()', r'\1:\2', line)
                  # Reign-era year spacing: 光武4年 / 光武 4 年 -> 光武 4年; likewise Chinese reign-title forms.
                  line=re.sub(r'([一-龥]{2,8})\s*(\d{1,3})\s*年', r'\1 \2年', line)
                  lines.append(line)
              s=''.join(lines)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit normalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Normalize ECT 001-065 microstyle'
          git push