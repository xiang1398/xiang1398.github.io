name: Normalize ECT 025-034 western article titles
on:
  push:
    paths:
      - '.github/workflows/normalize-ect-025-034-western-articles.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Quote western article titles in ECT 025-034
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title_number = re.compile(r'title:\s*["\']?《Early Chinese Texts》\s+(\d{3}):')
          journal = re.compile(r',\s+(\*[^*\n]+\*)\s+(?=\d)')
          latin = re.compile(r'[A-Za-zÀ-ÖØ-öø-ÿĀ-ž]')
          cjk = re.compile(r'[一-鿿㐀-䶿ぁ-ゖァ-ヺ]')

          def normalize_line(line):
              # Work from right to left so character offsets remain stable.
              matches = list(journal.finditer(line))
              for m in reversed(matches):
                  journal_comma = m.start()
                  prev_comma = line.rfind(',', 0, journal_comma)
                  if prev_comma < 0:
                      continue

                  title = line[prev_comma + 1:journal_comma].strip()
                  if not title:
                      continue

                  # Already styled, or clearly a CJK title/book title: leave untouched.
                  if title[0] in '“"‘\'*〈《':
                      continue
                  if cjk.search(title):
                      continue
                  if not latin.search(title):
                      continue

                  # Do not treat common bibliographic role labels as titles.
                  if title.lower() in {'ed.', 'eds.', 'trans.', 'tr.', 'editor', 'editors'}:
                      continue

                  # Chicago-like punctuation used elsewhere in this series:
                  # Author, “Article Title,” *Journal* volume ...
                  line = (
                      line[:prev_comma + 1]
                      + ' “' + title + ',”'
                      + line[journal_comma + 1:]
                  )
              return line

          changed = []
          for path in Path('_posts').glob('*early-chinese-texts-*.md'):
              text = path.read_text(encoding='utf-8')
              m = title_number.search(text)
              if not m:
                  continue
              number = int(m.group(1))
              if not 25 <= number <= 34:
                  continue

              new = ''.join(normalize_line(line) for line in text.splitlines(keepends=True))
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)

          print('Changed files:')
          for name in changed:
              print(name)
          PY
      - name: Commit normalized western article titles
        run: |
          if git diff --quiet -- _posts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Normalize western article titles in ECT 025-034'
          git push
