name: Update citation notice title marks

on:
  push:
    paths:
      - '.github/workflows/update-citation-marks.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update citation notice marks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('_posts'), Path('_drafts')]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.md'):
                  text = path.read_text(encoding='utf-8')
                  new = text.replace('「{{ page.title }}」', '〈{{ page.title }}〉')
                  new = new.replace('『{{ site.title }}』', '《{{ site.title }}》')
                  if new != text:
                      path.write_text(new, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts _drafts
          git commit -m 'Use Chinese title marks in citation notices'
          git push
