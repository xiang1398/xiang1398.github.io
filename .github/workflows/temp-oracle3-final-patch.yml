name: Temporary Oracle 3 Final Patch

on:
  push:
    paths:
      - '.oracle3-final-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch draft
        run: python .github/oracle3_final_patch.py
      - name: Commit patch
        run: |
          git config user.name "xiang1398"
          git config user.email "150796085+xiang1398@users.noreply.github.com"
          git add _drafts/Heji-material-source-original-bone-rubbing-holdings-abbreviations.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete final cross-audit of oracle-bone holding abbreviations"
          git push
