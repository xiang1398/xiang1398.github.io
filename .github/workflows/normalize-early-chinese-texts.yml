name: Normalize Early Chinese Texts source notes
on:
  push:
    paths:
      - 'tools/normalize_early_chinese_texts.py'
      - '.github/workflows/normalize-early-chinese-texts.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Preserve user-edited ETC 014
        run: cp _posts/2026-08-30-early-chinese-texts-Fa-yen.md /tmp/early-chinese-texts-Fa-yen.md

      - run: python tools/normalize_early_chinese_texts.py

      - name: Restore user-edited ETC 014
        run: cp /tmp/early-chinese-texts-Fa-yen.md _posts/2026-08-30-early-chinese-texts-Fa-yen.md

      - name: Match ETC 015-018 to ETC 014 citation style
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              '_posts/2026-08-30-early-chinese-texts-Feng-su-tung-i.md',
              '_posts/2026-08-30-early-chinese-texts-Han-chi.md',
              '_posts/2026-08-30-early-chinese-texts-Han-fei-tzu.md',
              '_posts/2026-08-30-early-chinese-texts-Han-shih-wai-chuan.md',
          ]

          for filename in files:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')

              # 동일한 역자 주가 연속 중복된 경우 하나만 남긴다.
              text = re.sub(
                  r'(\(역자 주: ([^)]+)\))(?:\1)+',
                  r'\1',
                  text,
              )

              # 바깥 괄호가 이미 인용 전체를 감싸는 경우 014처럼 마침표 뒤에 역자 주를 둔다.
              # (《漢書》 卷30, 1558쪽(역자 주: 〈藝文志〉))
              # → (《漢書》 卷30, 1558쪽. 역자 주: 〈藝文志〉)
              text = re.sub(
                  r'\((《(?:史記|漢書|後漢書|三國志|隋書|舊唐書|新唐書|宋史)》[^()\n]*?)\(역자 주: ([^)]+)\)\)',
                  r'(\1. 역자 주: \2)',
                  text,
              )

              # 《日本國見在書目錄》은 책 제목이므로 《》를 유지한다.
              text = re.sub(
                  r'\(역자 주: [《〈]日本國見在書目錄[》〉]\)(?:\(역자 주: [《〈]日本國見在書目錄[》〉]\))+',
                  '(역자 주: 《日本國見在書目錄》)',
                  text,
              )
              text = text.replace('(역자 주: 〈日本國見在書目錄〉)', '(역자 주: 《日本國見在書目錄》)')

              if filename.endswith('Feng-su-tung-i.md'):
                  text = text.replace(
                      '《三國志》 卷1(〈魏書〉 권1) 11쪽 주1',
                      '《三國志》 卷1, 11쪽 주1(역자 주: 〈魏書·武帝紀〉)'
                  )

              if filename.endswith('Han-chi.md'):
                  text = re.sub(
                      r'전혀 다르다\s*\(?《後漢書》 卷62, 2062쪽(?:\(역자 주: 〈荀悅傳〉\))*\)?\.',
                      '전혀 다르다(《後漢書》 卷62, 2062쪽. 역자 주: 〈荀悅傳〉).',
                      text,
                  )

              if filename.endswith('Han-shih-wai-chuan.md'):
                  text = text.replace(
                      '그의 전기(《史記》 卷121, 3124쪽(역자 주: 〈儒林列傳〉), 《漢書》 卷88, 3613쪽(역자 주: 〈儒林傳〉))',
                      '그의 전기(《史記》 卷121, 3124쪽, 《漢書》 卷88, 3613쪽. 역자 주: 〈儒林列傳〉, 〈儒林傳〉)'
                  )

              p.write_text(text, encoding='utf-8')
          PY

      - name: Normalize page reference labels and particles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_marker = re.compile(r'(?<![A-Za-z0-9])([0-9]+(?:[–-][0-9]+)?(?:·[0-9]+(?:[–-][0-9]+)?)*)쪽')
          particle_marker = re.compile(r'\b(pp?\.\s*[0-9][0-9,·–\-: ]*?)(은|는|이|가|을|를|과|와|으로|로)(?![가-힣])')

          def final_number(reference):
              numbers = re.findall(r'\d+', reference)
              return int(numbers[-1]) if numbers else None

          def has_batchim(number):
              return str(number)[-1] in '013678'

          def ends_l_batchim(number):
              return str(number)[-1] in '178'

          def correct_particle(number, particle):
              batchim = has_batchim(number)
              if particle in ('은', '는'):
                  return '은' if batchim else '는'
              if particle in ('이', '가'):
                  return '이' if batchim else '가'
              if particle in ('을', '를'):
                  return '을' if batchim else '를'
              if particle in ('과', '와'):
                  return '과' if batchim else '와'
              if particle in ('으로', '로'):
                  return '로' if (not batchim or ends_l_batchim(number)) else '으로'
              return particle

          for path in Path('_posts').glob('*early-chinese-texts-*.md'):
              original_text = path.read_text(encoding='utf-8')
              text = original_text

              def replace_page_marker(match):
                  pages = match.group(1)
                  label = 'pp.' if '–' in pages or '-' in pages or '·' in pages else 'p.'
                  return f'{label} {pages}'

              text = page_marker.sub(replace_page_marker, text)

              def replace_particle_marker(match):
                  reference, particle = match.group(1), match.group(2)
                  number = final_number(reference)
                  if number is None:
                      return match.group(0)
                  return reference + correct_particle(number, particle)

              new_text = particle_marker.sub(replace_particle_marker, text)
              if new_text != original_text:
                  path.write_text(new_text, encoding='utf-8')
          PY

      - name: Commit normalized citations
        run: |
          if git diff --quiet -- _posts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Normalize historical source titles in Early Chinese Texts'
          git push
