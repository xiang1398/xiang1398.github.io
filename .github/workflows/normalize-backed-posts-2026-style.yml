name: Clean remaining mixed Shijing title labels

on:
  push:
    paths:
      - '.github/workflows/normalize-backed-posts-2026-style.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining mixed title prefixes
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('_posts/2022-01-26-wang-li-critique-of-xieyin.md'),
              Path('_posts/2022-04-15-wang-li-development-of-old-rhyme-studies.md'),
              Path('_posts/2023-08-05-wang-li-shijing-29-rhyme-groups-and-middle-chinese-correspondence.md'),
          ]
          replacements = {
              '《시경‧': '《詩經‧',
              '《시경·': '《詩經·',
              '《주남‧': '《周南‧',
              '《주남·': '《周南·',
              '《소남‧': '《召南‧',
              '《소남·': '《召南·',
              '《소아‧': '《小雅‧',
              '《소아·': '《小雅·',
              '《대아‧': '《大雅‧',
              '《대아·': '《大雅·',
              '《빈풍‧': '《豳風‧',
              '《빈풍·': '《豳風·',
              '《패풍‧': '《邶風‧',
              '《패풍·': '《邶風·',
              '《정풍‧': '《鄭風‧',
              '《정풍·': '《鄭風·',
          }
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for a, b in replacements.items():
                  text = text.replace(a, b)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts
          git commit -m 'Clean remaining mixed Shijing title labels in backed posts'
          git push
