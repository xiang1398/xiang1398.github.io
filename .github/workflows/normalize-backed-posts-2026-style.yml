name: Repair affected backed posts safely

on:
  push:
    paths:
      - '.github/workflows/normalize-backed-posts-2026-style.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore eight affected posts and safely normalize
        run: |
          set -e
          BASE=13a77c3cdfaed311a76de4c7f47bb66a30b73950
          for f in \
            _posts/2022-10-22-yeongjo-preface-to-shijing.md \
            _posts/2022-10-23-shizhuan-daquan-fanli.md \
            _posts/2022-10-30-siku-quanshu-zongmu-shijing-daquan.md \
            _posts/2022-10-30-wenyuange-shizhuan-daquan-tiyao.md \
            _posts/2021-08-15-xinian-01.md \
            _posts/2021-09-12-xinian-02.md \
            _posts/2021-11-06-xinian-03.md \
            _posts/2022-01-23-xinian-04.md
          do
            git show "$BASE:$f" > "$f"
          done

          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('_posts/2022-10-22-yeongjo-preface-to-shijing.md'),
              Path('_posts/2022-10-23-shizhuan-daquan-fanli.md'),
              Path('_posts/2022-10-30-siku-quanshu-zongmu-shijing-daquan.md'),
              Path('_posts/2022-10-30-wenyuange-shizhuan-daquan-tiyao.md'),
              Path('_posts/2021-08-15-xinian-01.md'),
              Path('_posts/2021-09-12-xinian-02.md'),
              Path('_posts/2021-11-06-xinian-03.md'),
              Path('_posts/2022-01-23-xinian-04.md'),
          ]

          def convert_marks_preserve_citation(text):
              parts = text.split('---', 2)
              if len(parts) == 3:
                  fm = parts[1].replace('『', '《').replace('』', '》').replace('「', '〈').replace('」', '〉')
                  body = parts[2]
              else:
                  fm = None
                  body = text
              m = re.search(r'<p class="citation-notice">.*?</p>', body, flags=re.S)
              if m:
                  before = body[:m.start()].replace('『', '《').replace('』', '》').replace('「', '〈').replace('」', '〉')
                  citation = m.group(0)
                  after = body[m.end():].replace('『', '《').replace('』', '》').replace('「', '〈').replace('」', '〉')
                  body = before + citation + after
              else:
                  body = body.replace('『', '《').replace('』', '》').replace('「', '〈').replace('」', '〉')
              return ('---' + fm + '---' + body) if fm is not None else body

          replacements = {
              '《시경(詩經)》': '《詩經》',
              '《시전대전(詩傳大全)》': '《詩傳大全》',
              '《시경대전(詩經大全)》': '《詩經大全》',
              '《시집전대전(詩集傳大全)》': '《詩集傳大全》',
              '《시집전(詩集傳)》': '《詩集傳》',
              '《시전통석(詩傳通釋)》': '《詩傳通釋》',
              '《오경대전(五經大全)》': '《五經大全》',
              '《사서대전(四書大全)》': '《四書大全》',
              '《춘추대전(春秋大全)》': '《春秋大全》',
              '《흠정사고전서총목제요(欽定四庫全書總目提要)》': '《欽定四庫全書總目提要》',
              '《논어(論語)》': '《論語》',
              '《영조실록(英祖實錄)》': '《英祖實錄》',
              '〈위정(爲政)〉': '〈爲政〉',
              '《사기(史記)》': '《史記》',
              '《국어(國語)》': '《國語》',
              '《좌전(左傳)》': '《左傳》',
              '《계년(繫年)》': '《繫年》',
              '《청화대학장전국죽간(이)(淸華大學藏戰國竹簡(貳))》': '《淸華大學藏戰國竹簡(貳)》',
          }

          for path in paths:
              text = convert_marks_preserve_citation(path.read_text(encoding='utf-8'))
              for a, b in replacements.items():
                  text = text.replace(a, b)
              path.write_text(text, encoding='utf-8')

          # Safe, exact Hanja-style adjustments for Xinian only: never use a greedy regex.
          xinian_exact = {
              '청화대학(清華大學)': '清華大學',
              '전국시대(戰國時代)': '戰國時代',
              '춘추전국시대(春秋戰國時代)': '春秋戰國時代',
              '주(周)': '周',
              '상(商)': '商',
              '초(楚)': '楚',
              '진(晉)': '晉',
              '진(秦)': '秦',
              '정(鄭)': '鄭',
              '위(衛)': '衛',
              '무왕(武王)': '武王',
              '성왕(成王)': '成王',
              '평왕(平王)': '平王',
              '여왕(厲王)': '厲王',
              '선왕(宣王)': '宣王',
              '유왕(幽王)': '幽王',
              '숙왕(肅王)': '肅王',
              '공백 화(共伯和)': '共伯和',
              '견융(犬戎)': '犬戎',
              '삼감(三監)': '三監',
              '상읍(商邑)': '商邑',
              '비렴(飛廉)': '飛廉',
              '진중(秦仲)': '秦仲',
              '서주(西周)': '西周',
              '상제(上帝)': '上帝',
              '천신(天神)': '天神',
              '제적(帝籍)': '帝籍',
              '천무(千畝)': '千畝',
              '경사(卿士)': '卿士',
              '종국(宗國)': '宗國',
          }
          for path in [p for p in paths if 'xinian-' in p.name]:
              text = path.read_text(encoding='utf-8')
              for a, b in xinian_exact.items():
                  text = text.replace(a, b)
              path.write_text(text, encoding='utf-8')

          # User-facing titles: keep requested Korean wording where it was explicitly requested,
          # but use 2026-style Chinese book-title marks when a book title is embedded.
          p = Path('_posts/2022-10-30-siku-quanshu-zongmu-shijing-daquan.md')
          t = p.read_text(encoding='utf-8').replace('title: "사고전서총목제요 《시경대전(詩經大全)》 20권 통행본"', 'title: "사고전서총목제요 《詩經大全》 20권 통행본"')
          p.write_text(t, encoding='utf-8')
          p = Path('_posts/2022-10-30-wenyuange-shizhuan-daquan-tiyao.md')
          t = p.read_text(encoding='utf-8').replace('title: "문연각사고전서 《시전대전(詩傳大全)》 제요"', 'title: "문연각사고전서 《詩傳大全》 제요"')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Commit repaired posts
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts
          git commit -m 'Repair backed posts and apply safe 2026-style normalization'
          git push
