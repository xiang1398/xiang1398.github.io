name: Fix ECT 016-030 audit issues
on:
  push:
    paths:
      - '.github/workflows/fix-ect-016-030-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore omitted Hsin hsü bibliography and normalize confirmed citations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('_posts/2026-08-30-early-chinese-texts-Hsin-hsü.md')
          s = p.read_text(encoding='utf-8')
          start = s.index('## 2. 성립 연대와 저자')
          end = s.index('\n*—Michael Loewe*', start)
          replacement = '''## 2. 성립 연대와 저자

초기 자료는 劉向을 《新序》의 ‘저자’로 기록하지만, 실제로는 ‘편자’라고 하는 편이 더 정확하다. 이 책에는 劉向이 독창적으로 지은 내용이 거의 없으며, 내용의 실질은 다른 자료에서 가져왔기 때문이다. 편찬자가 아니라 저자라는 지위가 劉向에게 부여된 것은 《七略》에 실린 《新序》 항목을 잘못 해석한 데서 비롯하였다. 그 항목은 이 책과 다른 세 저작을 劉向이 ‘차례를 정한’(序) 67편 가운데 포함한다(《漢書》 卷30 p. 1727 참조. 역자 주: 〈藝文志〉). 《漢書》의 다른 구절(卷36 p. 1958. 역자 주: 〈楚元王傳〉)에 따르면 劉向은 “전기 기록에서 행적과 사건을 골라” 《新序》와 《說苑》을 모두 50편으로 저술(著)하여 황제에게 올렸다. 嚴靈峯은 아래 7항에서 언급한 연구에서 이 구절의 新序는 서명이 아니라 ‘새로 배열하다’라는 뜻으로 쓰였다고 주장하였다. 그렇다면 班固(32–92)가 劉向에게 귀속한 50편의 저작은 하나의 책, 곧 ‘새로 배열한 《說苑》’일 수도 있다.

후대의 서목과 문헌은 이 책을 劉向이 ‘撰’한 것으로 기록한다(《隋書》 卷34 p. 997; 《舊唐書》 卷47 p. 2024; 司馬貞의 《史記》 卷68 p. 2238 주). 그러나 이들 문헌은 《說苑》과 《列女傳》 역시 劉向이 撰했다고 서술하는데, 劉向 자신의 《七略別錄》에 남은 두 책의 기록은 그가 기존 자료를 교감(校)하여 편집했음을 분명히 보여 준다. 이 때문에 일부 학자는 劉向이 《新序》의 내용을 창작한 것이 아니라 수집·편집했을 뿐이라고 주장하였다. 반면 徐復觀은 현대 학자들이 漢代의 序라는 말의 뜻을 잘못 이해했으며, 당시에는 ‘저술하다’라는 의미도 있었다고 주장하였다.

劉向은 기원전 24년, 또는 한 자료에 따르면 기원전 25년에 《新序》를 황제에게 올렸다. 陸喜의 자전(3세기; 《晉書》 卷54 p. 1486)에 처음 보이는 전승에 따르면 劉向은 陸賈(기원전 228경–140경)의 《新語》를 직접 본떠 《新序》를 만들었다. 그러나 현전 《新語》와 《新序》를 면밀히 비교해 보면 문면이나 구조상 긴밀한 유사성은 드러나지 않는다. 두 책이 공유하는 뚜렷한 특징은 유가적 도덕주의뿐이다.

## 3. 본문의 전승

《漢書》는 《新序》의 정확한 권수를 밝히지 않지만, 학자들은 원래 30권이었다고 추정해 왔다. 《隋書》 卷34 p. 997, 《舊唐書》 卷47 p. 2024, 《新唐書》 卷59 p. 1510은 모두 儒家類에 30권본으로 기록한다. 北宋代에는 10권만 남아 있었으며, 曾鞏(1019–1083)이 이 잔편을 편집하여 오늘날 전하는 10권본을 만들었다.

## 4. 판본

- (a) 中國國家圖書館에 宋本이 소장되어 있다. 가장 널리 이용되는 판본은 1552–1566년에 만들어진 宋本의 영인본으로, 《四庫全書》와 《四部叢刊》에 수록되었다.
- (b) 출처가 알려지지 않은 판본이 《漢魏叢書》에 수록되어 있으며, 《廣漢魏叢書》본과 《增訂漢魏叢書》본도 있다.
- (c) 蔣鳳藻(19세기)가 여러 宋本을 교감한 판본을 바탕으로 한 판본이 《鐵華館叢書》에 수록되었고, 다시 《叢書集成》에 영인되었다.
- (d) 張國銓, 《新序校注》 (成都: 儒古, 1944).

《新序》는 이 밖에도 《天一閣叢書》, 《子書百家》, 《龍谿精舍叢書》에 수록되어 있다.

## 5. 본문 없이 간행된 주석

- (a) 盧文弨(1717–1796), 《新序校補》, 《群書拾補》 수록(《抱經堂叢書》).
- (b) 孫詒讓(1848–1908), 《札迻》 수록.
- (c) 蒙傳銘, 〈新序校記〉, 《新亞書院學術年刊》 12 (1970), pp. 19–73.
- (d) 梁榮茂, 《新序校補》 (臺北: 水牛, 1971).

## 6. 일문

- (a) 嚴可均(1762–1843), 《全上古三代秦漢三國六朝文》 卷39, 1a–10a.
- (b) 盧文弨, 《新序逸文》. 위 5(a)와 함께 간행되었다. 위 4(d)의 張國銓도 참조.

## 7. 최근 연구

- (a) 余嘉錫(1883–1955), 《四庫提要辨證》 卷10, pp. 544–554.
- (b) 羅根澤, 〈新序說苑列女傳不作始於劉向考〉, 《古史辨》 4; 《諸子考索》 (北京: 人民出版社, 1958), pp. 540–542에 재수록.
- (c) 趙仲邑, 〈新序試論〉, 《中山大學學報》 3 (1957), pp. 170–183.
- (d) 蒙傳銘, 〈劉向新序之重新考察〉, 《圖書館學報》 7 (1965), pp. 77–86.
- (e) 徐復觀, 〈劉向新序說苑的研究〉, 《大陸雜誌》 55:2 (1977), pp. 51–74.
- (f) Ikeda Shūzō 池田秀三, 〈劉向の學問と思想〉, 《東方學報》(Kyoto) 50 (1978), pp. 109–190, 특히 pp. 110–116.
- (g) 嚴靈峯, 〈劉向說苑別錄研究〉, 《大陸雜誌》 56:6 (1978), pp. 287–292.
- (h) 許素菲, 《劉向新序研究》 (臺北, 1980).

## 8. 현대 중국어 번역

盧元駿, 《新序今註今譯》 (臺北: 商務印書館, 1975).

## 9. 일본어 판본

L. 《中國古典新書》, 1973, Hirotsune Jinsei 廣常人世 편.

## 10. 색인

- (a) 《新序通檢》 (北京: 中法漢學研究所, 1946; 臺北: 成文出版社, 1968 재간). 《四部叢刊》본을 바탕으로 한다.
- (b) D. C. Lau·Chen Fong Ching 편, *A Concordance to the Xinxu* 《新序逐字索引》, ICS series (Hong Kong: Commercial Press, 1992).
'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')

          p = Path('_posts/2026-08-30-early-chinese-texts-Huang-ti-nei-ching.md')
          s = p.read_text(encoding='utf-8')
          fixes = {
            'Yamada Keiji 山田慶兒, 1979a. 〈黃帝內經の成立〉. *Shisō* 662:94–108.': 'Yamada Keiji 山田慶兒, 1979a. 〈黃帝內經の成立〉, *Shisō* 662:94–108.',
            'Yamada Keiji 山田慶兒, 1979b. The Formation of the Huang-ti nei-ching. Acta Asiatica 36:67–89. 1979a의 번역.': 'Yamada Keiji 山田慶兒, 1979b. “The Formation of the Huang-ti nei-ching,” *Acta Asiatica* 36:67–89. 1979a의 번역.',
            'Yamada Keiji 山田慶兒, 1980. 〈九宮八風說と少師派の立場〉. Tōhō Gakuhō (Kyoto) 52:199–242.': 'Yamada Keiji 山田慶兒, 1980. 〈九宮八風說と少師派の立場〉, *Tōhō Gakuhō* (Kyoto) 52:199–242.'
          }
          for old,new in fixes.items():
            if old not in s: raise SystemExit(f'028 target not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p = Path('_posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md')
          s = p.read_text(encoding='utf-8')
          fixes = {
            '(vi) Ch’en Ch’i-yün, A Confucian Magnate’s Idea of Political Violence: Hsün Shuang’s (A.D. 128–190) Interpretation of the Book of Changes, TP 54(1968), pp. 73–115.': '(vi) Ch’en Ch’i-yün, “A Confucian Magnate’s Idea of Political Violence: Hsün Shuang’s (A.D. 128–190) Interpretation of the Book of Changes,” *TP* 54 (1968), pp. 73–115.',
            '(vii) Peterson, Willard J., Making Connections: “Commentary on the Attached Verbalizations” of the Book of Changes, HJAS 42:1(1982년 6월), pp. 67–116.': '(vii) Peterson, Willard J., “Making Connections: ‘Commentary on the Attached Verbalizations’ of the Book of Changes,” *HJAS* 42:1 (1982년 6월), pp. 67–116.'
          }
          for old,new in fixes.items():
            if old not in s: raise SystemExit(f'029 target not found: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2026-08-30-early-chinese-texts-Hsin-hsü.md _posts/2026-08-30-early-chinese-texts-Huang-ti-nei-ching.md _posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md
          git commit -m 'Restore and normalize ECT 016-030 bibliography'
          git push
