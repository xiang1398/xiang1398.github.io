name: Polish Xinian translations

on:
  push:
    paths:
      - '.github/workflows/recover-and-normalize-backed-posts.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Korean readings with selective Hanja in Xinian translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
            '_posts/2021-08-15-xinian-01.md': '''옛날 주(周) 무왕(武王)께서 상왕(商王)이 상제(上帝)를 공경하지 않고 인사(禋祀)를 공경스럽게 지내지 않는 것을 보고 곧 제적(帝籍), 곧 왕이 직접 경작하는 밭을 만들어 상제와 천신(天神)에게 증제(烝祭)를 지냈으니, 그곳을 천무(千畝)라 하였다. 이렇게 해서 상읍(商邑)을 전복시키고 천하에 정치를 펴다가 여왕(厲王) 대에 이르렀다. 여왕이 주나라를 크게 학대하니 경사(卿士)와 여러 장관과 만민이 이를 용인하지 못하였다. 이에 여왕을 체(彘) 땅으로 쫓아내고 공백 화(共伯和)가 섰다. 14년 뒤 선왕(宣王)이 즉위하자 공백 화는 종국(宗國)으로 돌아갔다. 선왕은 비로소 제적을 버리고 친경하지 않았다. 재위 39년에 융(戎)이 천무에서 주나라 군사를 크게 패배시켰다.''',
            '_posts/2021-09-12-xinian-02.md': '''주(周) 유왕(幽王)은 서신(西申)에서 아내를 취하여 평왕(平王)을 낳았다. 왕은 또 포(褒)나라 사람의 딸을 취하였으니, 이 사람이 포사(褒姒)로 백반(伯盤)을 낳았다. 포사가 왕에게 총애를 받자 왕과 백반은 평왕을 축출하였고, 평왕은 서신으로 달아났다. 유왕이 군사를 일으켜 서신에서 평왕을 포위하였으나 신(申) 사람들이 내어주지 않았다. 증(繒) 사람들이 이에 서융(西戎)을 끌어들여 유왕을 공격하니 유왕과 백반이 죽고 주나라는 멸망하였다. 방군(邦君)과 여러 장관은 유왕의 아우 여신(余臣)을 괵(虢)에서 세웠으니, 이 사람이 휴혜왕(攜惠王)이다. 재위 21년에 진(晉) 문후(文侯) 구(仇)가 혜왕을 괵에서 죽였다. 주나라에 왕이 없어진 지 9년, 방군과 제후가 이때부터 주나라에 조회하지 않기 시작하자 진 문후가 소악(少鄂)에서 평왕을 맞이하여 경사(京師)에서 세웠다. 3년 뒤 동쪽으로 옮겨 성주(成周)에 이르렀고, 진나라는 이때부터 경사 방면을 개척하기 시작하였다. 정(鄭) 무공(武公)도 동방의 제후들을 다스렸다. 무공이 죽자 장공(莊公)이 즉위했고, 장공이 죽자 소공(昭公)이 즉위했다. 대부 고거미(高渠彌)가 소공을 죽이고 그 아우 자미 수(子眉壽)를 세웠다. 제(齊) 양공(襄公)이 수지(首止)에서 제후들과 회합하여 자미 수를 죽이고 고거미를 거열형에 처한 뒤 여공(厲公)을 다시 세우니 정나라가 비로소 안정되었다. 초(楚) 문왕(文王)은 한양(漢陽) 방면을 개척하였다.''',
            '_posts/2021-11-06-xinian-03.md': '''주(周) 무왕(武王)이 이미 은(殷)나라를 정복한 다음에 은에 삼감(三監)을 설치했다. 무왕이 돌아가시자 상읍(商邑)이 반란을 일으켜 삼감을 죽이고 녹자 경(祿子耿)을 세웠다. 성왕(成王)이 계속해서 상읍을 정벌하여 녹자 경을 죽이니, 비렴(飛廉)이 동쪽 상개씨(商蓋氏)의 땅으로 도망갔다. 성왕은 상개 땅을 정벌하여 비렴을 죽이고, 상개의 백성들을 서쪽 주어(邾吾) 땅으로 옮겨 노차지융(奴[⿱虘又]之戎)을 막도록 하니, 이들이 진(秦)나라의 선조이며 대대로 주나라의 호위가 되었다. 주나라 왕실이 이미 쇠미해진 후에 평왕(平王)이 동쪽으로 천도하여 성주(成周)에 이르자, 진중(秦仲)은 이때 동쪽으로 가 주나라 땅에 거하면서 주나라의 분묘를 지켰으니, 진나라가 이에 강대해졌다.''',
            '_posts/2022-01-23-xinian-04.md': '''주(周) 성왕(成王)과 주공(周公)이 이미 은(殷)나라 백성을 낙읍(洛邑)으로 옮긴 뒤에, 하(夏)나라와 상(商)나라가 망한 이유를 추념하여 널리 출종자(出宗子)를 세워 주나라의 두터운 병풍으로 삼았다. 이에 먼저 위숙 봉(衛叔 封)을 강구(康丘)에 세워 은나라의 남은 백성을 다스리는 제후로 삼았다. 위(衛)나라 사람들은 강구에서 기위(淇衛)로 옮겼다. 주 혜왕(周惠王) 재위 17년에 적적왕(赤翟王) 유우(留吁)가 군사를 일으켜 위나라를 공격하여 경(睘)에서 위나라 군사를 크게 패배시키니 유후(幽侯)가 멸망하였다. 적(翟)이 마침내 위나라에 거하자 위나라 사람들은 동쪽으로 황하를 건너 조(曹)로 옮겨 대공 신(戴公 申)을 세웠고, 공자 계방(公子 啟方)은 제(齊)나라로 달아났다. 대공이 죽자 제 환공(齊桓公)이 제후들과 회합하여 초구(楚丘)에 성을 쌓고 공자 계방을 세웠으니, 이가 문공(文公)이다. 문공이 죽자 성공(成公)이 즉위하였다. 적 사람들이 다시 황하를 건너 초구에서 위나라를 공격하자 위나라 사람들은 초구에서 제구(帝丘)로 옮겼다.'''
          }

          pattern = re.compile(r'(<p class="classical-translation">\s*\n)(.*?)(\n\s*</p>)', re.S)
          for filename, translation in replacements.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, n = pattern.subn(lambda m: m.group(1) + '    ' + translation + m.group(3), text, count=1)
              if n != 1:
                  raise RuntimeError(f'Could not replace translation in {filename}')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- _posts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts/2021-08-15-xinian-01.md _posts/2021-09-12-xinian-02.md _posts/2021-11-06-xinian-03.md _posts/2022-01-23-xinian-04.md
          git commit -m 'Polish Xinian translations to house style'
          git push
