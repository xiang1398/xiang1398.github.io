name: Normalize ECT 055-065 editorial style
on:
  push:
    paths:
      - '.github/workflows/normalize-ect-055-065-editorial.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Normalize
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths=[
            '_posts/2026-09-01-early-chinese-texts-Shuo-wen-chieh-tzu.md',
            '_posts/2026-09-01-early-chinese-texts-Shuo-yuan.md',
            '_posts/2026-09-01-early-chinese-texts-Sun-tzu-ping-fa.md',
            '_posts/2026-09-01-early-chinese-texts-Ta-Tai-li-chi.md',
            '_posts/2026-09-01-early-chinese-texts-Tai-hsuan-ching.md',
            '_posts/2026-09-01-early-chinese-texts-Tu-tuan.md',
            '_posts/2026-09-01-early-chinese-texts-Tung-kuan-Han-chi.md',
            '_posts/2026-09-01-early-chinese-texts-Wu-Yueh-chun-chiu.md',
            '_posts/2026-09-01-early-chinese-texts-Yen-tieh-lun.md',
            '_posts/2026-09-01-early-chinese-texts-Yen-tzu-chun-chiu.md',
            '_posts/2026-09-01-early-chinese-texts-Yueh-chueh-shu.md']
          notice='*이 번역문은 GPT-5.6 모델로 기계번역한 뒤 편집·교정한 것입니다.*'
          nr=re.compile(r'(?m)^\*{0,2}이 번역문은 GPT-5\.6 모델로 기계번역한 뒤 편집·교정한 것입니다\.?\*{0,2}$')
          for fn in paths:
            p=Path(fn); t=p.read_text(encoding='utf-8'); old=t
            t=nr.sub(notice,t)
            t=t.replace('(역자 주: 〈日本國見在書目錄〉)','(역자 주: 《日本國見在書目錄》)')
            t=re.sub(r'(《[^》]+》\s*卷\d+(?:上|下)?),\s+(pp?\.)',r'\1 \2',t)
            t=re.sub(r'(?<![A-Za-z])(卷\d+(?:上|下)?),\s+(pp?\.)',r'\1 \2',t)
            t=re.sub(r'(《[^》]+》)\s*권(?=\d)',r'\1 卷',t)
            t=re.sub(r'(?m)^(\s*)\\\(([A-Za-z]|[ivxlcdmIVXLCDM]+)\\\)(\s+)',r'\1(\2)\3',t)
            # Western article punctuation already in quotes.
            t=re.sub(r'“([^”\n]+)”\s*,\s*(\*[^*\n]+\*)',r'“\1,” \2',t)
            t=re.sub(r'“([^”\n]+)”,\s*(\*[^*\n]+\*)',r'“\1,” \2',t)
            # CJK journal titles use book-title brackets rather than Western italics.
            t=re.sub(r'(〈[^〉\n]+〉,\s*)\*([\u3400-\u9fff][^*\n]*)\*',r'\1《\2》',t)
            # Conservative Western article quoting: only when an italic journal title is followed by a volume/issue number.
            lines=[]
            journal=re.compile(r',\s+(\*[^*\n]+\*)\s+(?=\d|[IVXLCDM])')
            for line in t.splitlines(keepends=True):
              ms=list(journal.finditer(line))
              for m in reversed(ms):
                jc=m.start(); pc=line.rfind(',',0,jc)
                if pc<0: continue
                title=line[pc+1:jc].strip()
                if not title or title[0] in '“"‘\'*〈《' or re.search(r'[\u3400-\u9fffぁ-ゖァ-ヺ]',title): continue
                if len(title)<5 or len(title)>170: continue
                line=line[:pc+1]+' “'+title+',”'+line[jc+1:]
              lines.append(line)
            t=''.join(lines)
            if t!=old:p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- _posts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Normalize ECT 055-065 editorial style'
          git push
