name: Temporary Oracle 3 Regional Patch

on:
  push:
    paths:
      - '.oracle3-regional-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch draft
        run: python .github/oracle3_regional_patch.py
      - name: Commit patch
        run: |
          git config user.name "xiang1398"
          git config user.email "150796085+xiang1398@users.noreply.github.com"
          git add _drafts/Heji-material-source-original-bone-rubbing-holdings-abbreviations.md
          git diff --cached --quiet && exit 0
          git commit -m "Expand regional Chinese oracle-bone holding abbreviations"
          git push
