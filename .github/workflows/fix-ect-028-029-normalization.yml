name: Normalize ECT 028-029 bibliography style
on:
  push:
    paths:
      - '.github/workflows/fix-ect-028-029-normalization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize confirmed bibliography entries
        run: |
          python - <<'PY'
          from pathlib import Path

          fixes = {
            '_posts/2026-08-30-early-chinese-texts-Huang-ti-nei-ching.md': [
              ('Yamada Keiji 山田慶兒, 1979a. 〈黃帝內經の成立〉. *Shisō* 662:94–108.',
               'Yamada Keiji 山田慶兒, 1979a. 〈黃帝內經の成立〉, *Shisō* 662:94–108.'),
              ('Yamada Keiji 山田慶兒, 1979b. The Formation of the Huang-ti nei-ching. Acta Asiatica 36:67–89. 1979a의 번역.',
               'Yamada Keiji 山田慶兒, 1979b. “The Formation of the Huang-ti nei-ching,” *Acta Asiatica* 36:67–89. 1979a의 번역.'),
              ('Yamada Keiji 山田慶兒, 1980. 〈九宮八風說と少師派の立場〉. Tōhō Gakuhō (Kyoto) 52:199–242.',
               'Yamada Keiji 山田慶兒, 1980. 〈九宮八風說と少師派の立場〉, *Tōhō Gakuhō* (Kyoto) 52:199–242.'),
            ],
            '_posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md': [
              ('(vi) Ch’en Ch’i-yün, A Confucian Magnate’s Idea of Political Violence: Hsün Shuang’s (A.D. 128–190) Interpretation of the Book of Changes, TP 54(1968), pp. 73–115.',
               '(vi) Ch’en Ch’i-yün, “A Confucian Magnate’s Idea of Political Violence: Hsün Shuang’s (A.D. 128–190) Interpretation of the Book of Changes,” *TP* 54 (1968), pp. 73–115.'),
              ('(vii) Peterson, Willard J., Making Connections: “Commentary on the Attached Verbalizations” of the Book of Changes, HJAS 42:1(1982년 6월), pp. 67–116.',
               '(vii) Peterson, Willard J., “Making Connections: ‘Commentary on the Attached Verbalizations’ of the Book of Changes,” *HJAS* 42:1 (1982년 6월), pp. 67–116.'),
            ],
          }
          for fn, replacements in fixes.items():
              p = Path(fn)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Target not found in {fn}: {old}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2026-08-30-early-chinese-texts-Huang-ti-nei-ching.md _posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md
          git commit -m 'Normalize ECT 028-029 bibliography style'
          git push
