name: Final ECT style audit and correction
on:
  push:
    paths: ['.github/workflows/ect-style-final-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply curated corrections and audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=sorted(Path('_posts').glob('*early-chinese-texts-*.md'))

          # Curated reversions: these are traditional text/folio locators, not journal volume:issue.
          exact = {
            '_posts/2026-08-29-early-chinese-texts-Chou-pi-suan-ching.md': [
              ('《太平御覽》 1:10b', '《太平御覽》 1.10b'),
            ],
            '_posts/2026-08-31-early-chinese-texts-Mu-tien-tzu-chuan.md': [
              ('《郡齋讀書志》 9:1b', '《郡齋讀書志》 9.1b'),
              ('《禹貢》 1:5, p. 6 이하, 2.5, p. 31 이하, 2.6, p. 18 이하, 3.4, p. 31 이하',
               '《禹貢》 1:5, p. 6 이하, 2:5, p. 31 이하, 2:6, p. 18 이하, 3:4, p. 31 이하'),
            ],
            '_posts/2026-08-31-early-chinese-texts-Pai-hu-tung.md': [
              ('《讀書叢錄》 16:14a–18a', '《讀書叢錄》 16.14a–18a'),
              ('《札迻》 10:1a–6a', '《札迻》 10.1a–6a'),
            ],
            '_posts/2026-08-31-early-chinese-texts-Shen-chien.md': [
              ('《慈溪黃氏日抄分類》 57:6b–7a', '《慈溪黃氏日抄分類》 57.6b–7a'),
              ('《百子辨正》 1:23', '《百子辨正》 1.23'),
            ],
            '_posts/2026-08-31-early-chinese-texts-Shen-tzu-Shen-Pu-hai.md': [
              ('《淮南子》 21:9b', '《淮南子》 21.9b'),
            ],
            '_posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md': [
              ('《文物》 1974:7 도판 I과 1984.3 도판 I·II', '《文物》 1974:7 도판 I과 1984:3 도판 I·II'),
            ],
          }
          for fn,repls in exact.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              for old,new in repls:
                  if old in s:
                      s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          # House-style passes restricted to unambiguous contexts.
          known_journals = [
            '史學雜誌','中華醫史雜誌','國粹學報','禹貢','人文雜誌','日本東洋醫學會誌',
            '大陸雜誌','集刊東洋學','東方宗教','新亞學報','世界宗教研究','歷史硏究','歷史研究',
            '甘肅師大學報','北京中醫學院學報','文物','文物資料叢刊','史學雜誌','支那學研究',
            '中央研究院歷史語言研究所集刊','中央硏究院歷史語言硏究所集刊','東方學','岡山史學',
            '新亞書院學術年刊','中國哲學史研究','京都大學文學部研究紀要'
          ]
          journal_abbr=['HJAS','BIHP','TP','RBS','BSOAS','JAOS','JAS','MS','MSOS','THG','TSK','WW','KKHP','LSYC']

          for p in files:
              s=p.read_text(encoding='utf-8')
              # Initials for personal names: keep standard non-name abbreviations compact.
              # Known author/editor initials still found compact are spaced by contextual surname/name patterns.
              s=re.sub(r'\b(D)\.(C)\.\s+(Lau)\b', r'D. C. \3', s)
              s=re.sub(r'\bLau,\s*D\.C\.', 'Lau, D. C.', s)
              s=re.sub(r'\bJ\.J\.L\.', 'J. J. L.', s)
              s=re.sub(r'\bA\.F\.P\.', 'A. F. P.', s)
              s=re.sub(r'\bN\.G\.D\.', 'N. G. D.', s)
              s=re.sub(r'\bW\.A\.C\.H\.', 'W. A. C. H.', s)
              s=re.sub(r'\bY\.P\.', 'Y. P.', s)

              s=re.sub(r'(?<![A-Za-z*])\*?ICS\*?\s*(?:총서|series)', '*ICS* series', s, flags=re.I)
              lines=[]
              for line in s.splitlines(True):
                  if '*ICS* series' in line or 'Concordance' in line:
                      line=re.sub(r'(?:홍콩|香港)(?=\s*:|\s+商務印書館)', 'Hong Kong', line)
                  for j in known_journals:
                      # only immediately after a known journal title
                      line=re.sub(rf'(《{re.escape(j)}》\s+)(\d{{1,4}})\.(\d{{1,2}}(?:[–-]\d{{1,2}})?)', r'\1\2:\3', line)
                      # repeated year.issue references in a line already anchored to the same journal
                      if f'《{j}》' in line:
                          line=re.sub(r'(?<!\d)(19\d{2}|20\d{2})\.(\d{1,2})(?=\b|,|\s)', r'\1:\2', line)
                  for a in journal_abbr:
                      line=re.sub(rf'\b({a})\s+(\d{{1,3}})\.(\d{{1,2}}(?:[–-]\d{{1,2}})?)', r'\1 \2:\3', line)
                  # italic Western journal names only when followed by year in parentheses
                  line=re.sub(r'(\*[^*\n]+\*\s+)(\d{1,3})\.(\d{1,2}(?:[–-]\d{1,2})?)(?=\s*\(\d{4})', r'\1\2:\3', line)
                  # Regnal era spacing.
                  line=re.sub(r'([一-龥]{2,8})\s*(\d{1,2})\s*年', r'\1 \2年', line)
                  lines.append(line)
              p.write_text(''.join(lines),encoding='utf-8')

          # Audit only unambiguous violations and known false-positive locator forms.
          residual=[]
          bad_exact=[
            '《太平御覽》 1:10b','《郡齋讀書志》 9:1b','《讀書叢錄》 16:14a–18a',
            '《札迻》 10:1a–6a','《慈溪黃氏日抄分類》 57:6b–7a','《百子辨正》 1:23','《淮南子》 21:9b'
          ]
          for p in files:
              text=p.read_text(encoding='utf-8')
              for b in bad_exact:
                  if b in text: residual.append(f'{p}: false book-locator colon: {b}')
              if re.search(r'\bD\.C\.\s+Lau\b|\bLau,\s*D\.C\.',text):
                  residual.append(f'{p}: compact D.C. personal initials')
              if re.search(r'(?<!\*)\bICS\s+(?:총서|series)',text,re.I) or 'ICS 총서' in text:
                  residual.append(f'{p}: ICS style')
              for line in text.splitlines():
                  if ('*ICS* series' in line or 'Concordance' in line) and re.search(r'(홍콩|香港)(?=\s*:|\s+商務印書館)',line):
                      residual.append(f'{p}: Hong Kong style: {line}')
                  if re.search(r'[一-龥]{2,8}\d{1,2}年|[一-龥]{2,8}\s+\d{1,2}\s+年',line):
                      residual.append(f'{p}: regnal-year spacing: {line}')
                  for j in known_journals:
                      if re.search(rf'《{re.escape(j)}》\s+\d{{1,4}}\.\d{{1,2}}',line):
                          residual.append(f'{p}: journal volume.issue dot: {line}')
                  for a in journal_abbr:
                      if re.search(rf'\b{a}\s+\d{{1,3}}\.\d{{1,2}}',line):
                          residual.append(f'{p}: journal abbreviation volume.issue dot: {line}')
              # folio letters with colon after Chinese title are almost certainly textual locators, not journal issues
              for m in re.finditer(r'《[^》]+》\s+\d+:(\d+[ab])(?:–\d+[ab])?',text):
                  residual.append(f'{p}: suspicious folio colon: {m.group(0)}')

          Path('_data/ect_style_audit.txt').write_text(
              'RESIDUAL_COUNT='+str(len(residual))+'\n'+'\n'.join(residual)+'\n',encoding='utf-8')
          PY
      - name: Commit corrections and audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/*early-chinese-texts-*.md _data/ect_style_audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine and verify ECT 001-065 house style'
          git push