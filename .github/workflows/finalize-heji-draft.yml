name: Finalize Heji draft
on:
  push:
    paths:
      - '.github/workflows/finalize-heji-draft.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_drafts/Heji-material-source-original-bone-rubbing-holdings-abbreviations.md')
          s=p.read_text()
          repl={
          '**考沐**. 中國社會科學院考古研究所原沐園. 舊藏. 정확한 수장자와 遞藏 관계는 후속 검증 대상으로 둔다. [2]':'**考沐**. 中國社會科學院考古研究所原沐園. 舊藏. **沐園은 羅伯昭(1899–1976)의 號**로 확인된다. 羅伯昭舊藏 가운데 考古研究所로 들어간 자료군으로 이해할 수 있다. [2][AV]',
          '**考倬**. 中國社會科學院考古研究所原倬盦. 舊藏. 인명, 齋號 식별은 후속 검증 대상으로 둔다. [2]':'**考倬**. 中國社會科學院考古研究所原倬盦. 舊藏. **倬盦은 邵章(1872–1953)의 號**이다. 따라서 `考邵`와 `考倬`은 같은 邵章舊藏을 본명과 號로 각각 표시한 자료군이며, 두 자료군을 나눈 구체적 기준은 원편찬자료의 추가 확인이 필요하다. [2][AW]',
          '이 24개를 보충하면 Appendix02의 211개 항목은 모두 적어도 한 번씩 상세해설 절에서 다뤄진다. 다만 `川合`, `元嘉`, `西川`, `松谷`, `法茹`, `黃龍`처럼 식별 근거가 약한 항목은 해설을 추가한 것이 곧 교감 완료를 뜻하지 않는다.':'이 24개를 보충하면 Appendix02의 211개 항목은 모두 적어도 한 번씩 상세해설 절에서 다뤄진다. 이 가운데 `元嘉`, `西川`, `松谷`, `黃龍`은 후대 자료를 통해 식별을 보강하였으며, `川合`, `法茹` 등은 여전히 정확한 인명·상호 또는 provenance의 추가 검증이 필요하다.',
          '## 14. 반드시 교감할 항목':'## 14. 교감 현황',
          '우선 재검토가 필요한 항목은 다음과 같다.':'교감 결과는 **미해결**, **잠정 식별**, **교감 완료**의 세 단계로 구별한다. 아래 목록은 원표 자체의 이상 여부와 후대 자료를 통한 식별 상태를 함께 보여 준다.',
          '아래 목록은 《甲骨文合集材料來源表》 上編 附錄二 원판을 기준으로 하고 小學堂 전자본을 대조한 211개 항목의 실용 색인이다.[2] 상세 provenance 검증은 위의 묶음별로 순차 보강한다.':'아래 목록은 《甲骨文合集材料來源表》 上編 附錄二 원판을 기준으로 하고 小學堂 전자본을 대조한 211개 항목의 실용 색인이다.[2] **전칭은 색인 기능을 위해 원판 표기를 그대로 보존하며, 인명·기관명의 교정 결과는 앞의 상세 해설을 따른다.** 상세 provenance 검증은 위의 묶음별로 순차 보강한다.'
          }
          for a,b in repl.items():
              if a not in s:
                  raise SystemExit('replacement target not found: '+a[:80])
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _drafts/Heji-material-source-original-bone-rubbing-holdings-abbreviations.md
          git diff --cached --quiet || git commit -m 'Finalize Heji material-source draft'
          git push
