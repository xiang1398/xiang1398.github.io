name: Recheck ECT 001-065 editorial style
on:
  push:
    paths:
      - '.github/workflows/recheck-ect-001-065-editorial.yml'
permissions:
  contents: write
jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Recheck and normalize
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title_number = re.compile(r'title:\s*["\']?《Early Chinese Texts》\s+(\d{3}):')
          notice = '*이 번역문은 GPT-5.6 모델로 기계번역한 뒤 편집·교정한 것입니다.*'
          notice_re = re.compile(r'(?m)^\*{0,2}이 번역문은 GPT-5\.6 모델로 기계번역한 뒤 편집·교정한 것입니다\.?\*{0,2}$')

          exact = {
            13: [
              ('Karlgren, The Early History of the Chou Li and Tso Chuan Texts, *BMFEA*', 'Karlgren, “The Early History of the Chou Li and Tso Chuan Texts,” *BMFEA*'),
            ],
            21: [
              ('Karlgren은 On the Authenticity and Nature of the Tso chuan, *Göteborgs Högskolas Årsskrift*', 'Karlgren은 “On the Authenticity and Nature of the Tso chuan,” *Göteborgs Högskolas Årsskrift*'),
            ],
            23: [
              ('The Canon of Laws by Li K’uei—A Double Falsification, *Archiv Orientální*', '“The Canon of Laws by Li K’uei—A Double Falsification,” *Archiv Orientální*'),
              ('The Life of Huan T’an, *Archiv Orientální*', '“The Life of Huan T’an,” *Archiv Orientální*'),
            ],
            46: [
              ('Riccardo Fracasso, Teratoscopy or Divination by Monsters, Being a Study on the Wu-tsang Shan-ching, 《漢學硏究》', 'Riccardo Fracasso, “Teratoscopy or Divination by Monsters, Being a Study on the Wu-tsang Shan-ching,” 《漢學硏究》'),
              ('Gustave Schlegel, Problèmes Géographiques: les Peuples étrangers chez les historiens Chinois [지리적 문제들: 중국 史家들의 기록에 나타난 이민족들], 첫 논문은 *T’oung Pao*', 'Gustave Schlegel, “Problèmes Géographiques: les Peuples étrangers chez les historiens Chinois” [지리적 문제들: 중국 史家들의 기록에 나타난 이민족들], 첫 논문은 *T’oung Pao*'),
            ],
            48: [
              ('Karlgren, “Bernhard,” *Glosses on the Book of Documents* II, *BMFEA* 21 (1949)', 'Karlgren, Bernhard, “Glosses on the Book of Documents II,” *BMFEA* 21 (1949)'),
            ],
            49: [
              ('Heinrich Busch, Hsün Yüeh, “ein Denker am Hofe des letzten Han-Kaisers [마지막 漢 황제의 궁정 사상가 荀悅],” *Monumenta Serica*', 'Heinrich Busch, “Hsün Yüeh, ein Denker am Hofe des letzten Han-Kaisers” [마지막 漢 황제의 궁정 사상가 荀悅], *Monumenta Serica*'),
            ],
            52: [
              ('A. F. P. Hulsewé, The problem of the authenticity of Shih chi ch. 123, The Memoir on Ta Yüan, *T’oung Pao*', 'A. F. P. Hulsewé, “The problem of the authenticity of Shih chi ch. 123, The Memoir on Ta Yüan,” *T’oung Pao*'),
              ('E. G. Pulleyblank, Chinese and Indo-Europeans, *Journal of the Royal Asiatic Society*', 'E. G. Pulleyblank, “Chinese and Indo-Europeans,” *Journal of the Royal Asiatic Society*'),
              ('The Wu-sun and Sakas and the Yüeh-chih migration, *Bulletin of the School of Oriental and African Studies*', '“The Wu-sun and Sakas and the Yüeh-chih migration,” *Bulletin of the School of Oriental and African Studies*'),
            ],
            54: [
              ('Roy Andrew Miller, “위 (a)에 대한 서평,” *T’oung Pao*', 'Roy Andrew Miller, 위 (a)에 대한 서평, *T’oung Pao*'),
              ('Roy Andrew Miller, The Far East \\[극동\\], Thomas E. Sebeok 편', 'Roy Andrew Miller, “The Far East” \\[극동\\], Thomas E. Sebeok 편'),
            ],
            64: [
              ('Alfred Forke, Yen Ying, Staatsman und Philosoph, und das Yen-tse Tch’un-tsch’iu, *Asia Major*', 'Alfred Forke, “Yen Ying, Staatsman und Philosoph, und das Yen-tse Tch’un-tsch’iu,” *Asia Major*'),
            ],
          }

          changed=[]
          for p in Path('_posts').glob('*early-chinese-texts-*.md'):
            t=p.read_text(encoding='utf-8'); m=title_number.search(t)
            if not m: continue
            n=int(m.group(1))
            if not 1 <= n <= 65: continue
            old=t

            t=t.replace('**이 번역문은 GPT-5.6 모델로 기계번역한 뒤 편집·교정한 것입니다.*.*', notice)
            t=notice_re.sub(notice,t)
            t=t.replace('(역자 주: 〈日本國見在書目錄〉)','(역자 주: 《日本國見在書目錄》)')
            t=re.sub(r'(《[^》]+》\s*卷\d+(?:上|下)?),\s+(pp?\.)',r'\1 \2',t)
            t=re.sub(r'(?<![A-Za-z])(卷\d+(?:上|下)?),\s+(pp?\.)',r'\1 \2',t)
            t=re.sub(r'(《[^》]+》)\s*권(?=\d)',r'\1 卷',t)

            # Unnecessary Markdown escaping in alphabetic/Roman list labels, including blockquotes.
            t=re.sub(r'(?m)^(\s*(?:>\s*)?)\\\(([A-Za-z]|[ivxlcdmIVXLCDM]+)\\\)(\s+)',r'\1(\2)\3',t)

            # Quoted Western article punctuation: comma belongs inside closing quotation mark.
            t=re.sub(r'“([^”\n]+)”\s*,\s*(\*[^*\n]+\*)',r'“\1,” \2',t)
            t=re.sub(r'“([^”\n]+)”,\s*(\*[^*\n]+\*)',r'“\1,” \2',t)

            # CJK article + journal convention.
            t=re.sub(r'(〈[^〉\n]+〉,\s*)\*([\u3400-\u9fff][^*\n]*)\*',r'\1《\2》',t)

            # Parenthetical historical citations with a nested translator note.
            t=re.sub(r'\((《(?:史記|漢書|後漢書|三國志|晉書|隋書|舊唐書|新唐書|宋史)》[^()\n]*?)\(역자 주:\s*([^)]+)\)\)',r'(\1. 역자 주: \2)',t)
            t=re.sub(r'\((卷\d+(?:上|下)?\s+pp?\.\s*[0-9][0-9·–\-]*)[,]\s*역자 주:\s*([^)]+)\)',r'(\1. 역자 주: \2)',t)

            # Author signatures: standalone em dash + Latin names.
            t=re.sub(r'(?m)^—\s*([A-Z][A-Za-zÀ-ÖØ-öø-ÿ.\- ]+(?:·[A-Z][A-Za-zÀ-ÖØ-öø-ÿ.\- ]+)*)$', r'*—\1*', t)

            for a,b in exact.get(n,[]):
              t=t.replace(a,b)

            if t!=old:
              p.write_text(t,encoding='utf-8'); changed.append(p.name)

          print('Changed files:')
          for f in changed: print(f)
          PY
      - name: Commit recheck
        run: |
          if git diff --quiet -- _posts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Recheck ECT 001-065 editorial consistency'
          git push
