name: Normalize ECT post titles
on:
  push:
    paths: ['.github/workflows/normalize-ect-post-titles.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize titles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path('_posts').glob('*early-chinese-texts-*.md'))
          posts=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              m=re.search(r'^title:\s*"《Early Chinese Texts》\s+(\d{3}):\s*(.*?)"\s*$',s,re.M)
              if m:
                  posts.append((p,s,m))
          if len(posts) != 65:
              raise SystemExit(f'Expected 65 ECT posts, found {len(posts)}')

          hanzi=re.compile(r'[\u3400-\u9fff]')
          def format_item(n, rest):
              if n == '001':
                  return f'*Early Chinese Texts* {n}: {rest}'
              # Preserve parenthetical alternate titles, but format each romanized title + Hanzi title pair.
              def pair(seg):
                  seg=seg.strip()
                  # romanized portion followed by one or more Han characters
                  mm=re.match(r'^(.*?)([\u3400-\u9fff][\u3400-\u9fff·・]*)$',seg)
                  if not mm:
                      return seg
                  roman=mm.group(1).strip()
                  hz=mm.group(2).strip()
                  return f'*{roman}* 《{hz}》'
              # Split only a final parenthetical alternate title, e.g. I ching 易經 (Chou I 周易)
              pm=re.match(r'^(.*?)\s*\(([^()]*)\)\s*$',rest)
              if pm and hanzi.search(pm.group(2)):
                  return f'*Early Chinese Texts* {n}: {pair(pm.group(1))} ({pair(pm.group(2))})'
              return f'*Early Chinese Texts* {n}: {pair(rest)}'

          nums=[]
          for p,s,m in posts:
              n,rest=m.group(1),m.group(2)
              nums.append(n)
              new_title=format_item(n,rest)
              old=m.group(0)
              new=f'title: "{new_title}"'
              s=s[:m.start()]+new+s[m.end():]
              p.write_text(s,encoding='utf-8')
          expected=[f'{i:03d}' for i in range(1,66)]
          if sorted(nums) != expected:
              raise SystemExit(f'Number mismatch: {sorted(nums)}')
          # Post-check exact title count and absence of old title marker.
          changed=0
          for p,_s,_m in posts:
              s=p.read_text(encoding='utf-8')
              if re.search(r'^title:\s*"\*Early Chinese Texts\*\s+\d{3}:',s,re.M): changed+=1
              if re.search(r'^title:\s*"《Early Chinese Texts》',s,re.M):
                  raise SystemExit(f'Old title remains: {p}')
          if changed != 65:
              raise SystemExit(f'Expected 65 normalized titles, found {changed}')
          print('NORMALIZED_TITLE_COUNT=65')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/*early-chinese-texts-*.md
          git commit -m 'Normalize ECT 001-065 post titles'
          git push
