name: Apply ECT 029-034 audit fixes
on:
  push:
    paths:
      - '.github/workflows/fix-ect-029-034-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact bibliography fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          fixes = {
            '_posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md': [
              ('(i) Waley, Arthur, The Book of Changes, BMFEA 5(1933), pp. 121–142.',
               '(i) Waley, Arthur, “The Book of Changes,” *BMFEA* 5 (1933), pp. 121–142.'),
              ('(iv) Hellmut Wilhelm, The Book of Changes in the Western Tradition. 위 10절 참조. 서양 번역과 연구의 선별 서지.',
               '(iv) Hellmut Wilhelm, “The Book of Changes in the Western Tradition.” 위 10절 참조. 서양 번역과 연구의 선별 서지.'),
            ],
            '_posts/2026-08-31-early-chinese-texts-Kung-tzu-chia-yu.md': [
              ('(i) Haloun, Gustav, “Fragmente des Fu-tsï und des Tsin-tsï: Früh-Konfuzianische Fragmente I [《宓子》와 《晉子》 단편: 초기 유가 단편 I],” *Asia Major* 8(1932), pp. 437–509.',
               '(i) Haloun, Gustav, “Fragmente des Fu-tsï und des Tsin-tsï: Früh-Konfuzianische Fragmente I” [《宓子》와 《晉子》 단편: 초기 유가 단편 I], *Asia Major* 8 (1932), pp. 437–509.'),
            ],
          }
          for fn,repls in fixes.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              for old,new in repls:
                  if old not in s: raise SystemExit(f'Target not found in {fn}: {old}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _posts/2026-08-30-early-chinese-texts-I-ching-Chou-i.md _posts/2026-08-31-early-chinese-texts-Kung-tzu-chia-yu.md
          git commit -m 'Fix ECT 029 and 034 bibliography formatting'
          git push
