name: Temporary Oracle 3 Patch

on:
  push:
    paths:
      - '.oracle3-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch draft
        run: python .github/oracle3_patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _drafts/Heji-material-source-original-bone-rubbing-holdings-abbreviations.md
          git commit -m 'Expand oracle-bone holding abbreviations for Taiwan Hong Kong and major Chinese collections'
          git push
