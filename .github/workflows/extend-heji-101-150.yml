name: Extend Heji collation 101-150
on:
  push:
    paths:
      - '.github/workflows/extend-heji-101-150.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct numbering and add 101-150
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('_drafts/Heji-material-source-original-bone-rubbing-holdings-source-based-rewrite.md')
          s=p.read_text()
          a=s.index('### 9.2 원판·小學堂 대조표 51–100')
          b=s.index('211개 전체 표는', a)
          sec=s[a:b]
          # Earlier pass accidentally omitted 津博 (actual no. 51), shifting 51–100 by one.
          lines=sec.splitlines()
          out=[]
          for line in lines:
              m=re.match(r'\| (\d+) \|', line)
              if m and 51 <= int(m.group(1)) <= 100:
                  n=int(m.group(1))+1
                  line=re.sub(r'^\| \d+ \|', f'| {n} |', line)
              out.append(line)
          sec='\n'.join(out)
          header='|---:|---|---|---|---|---|'
          sec=sec.replace(header, header+'\n| 51 | 津博 | 天津歷史博物館 | 津博 · 天津歷史博物館 | 기관 소장단위 | 일치 |',1)
          # Remove shifted 101 西川 from 9.2; it begins 9.3 below.
          sec='\n'.join(x for x in sec.splitlines() if not x.startswith('| 101 | 西川 |'))
          sec=sec.replace('51–100에서는', '51–100에서는')
          block=r'''

