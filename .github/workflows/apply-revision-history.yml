name: Apply revision histories

on:
  push:
    branches:
      - revision-history-audit-20260828

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply revision histories to posts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision-history-audit-20260828
      - name: Append curated revision histories
        shell: python
        run: |
          from pathlib import Path

          entries = {
              "_posts/2026-08-25-Reflections-on-Korean-Classical-Literature.md": (
                  "2026-08-25",
                  "강호시가의 문화물질주의적 비평을 대폭 보강하고, 자연의 관념화·은일과 정치 질서의 공존·노동의 비가시화 문제 및 서양 목가시와의 비교를 추가하였다."
              ),
              "_posts/2026-08-26-Abbreviations-for-Classical-Latin-and-Greek-Authors-and Texts.md": (
                  "2026-08-26",
                  "라틴·그리스 저자와 작품 약호의 수록 범위를 크게 확대하고, 실제 인용에 사용할 표준 약호 중심으로 목록을 재정비하였다."
              ),
              "_posts/2026-08-26-.pre-Heji-oracle-bone-catalogues-and-the-Jiaguwen-Heji.md": (
                  "2026-08-26",
                  "《甲骨文合集》 이전 저록의 자료 내원·소장 계통을 다시 조사하여 출전과 유형 구분을 보강하고, 《合集》 및 《材料來源表》의 자료 체계와 문서의 조사 범위를 명확히 하였다."
              ),
              "_posts/2026-08-26-post-Heji-oracle-bone-catalogues-and-joining-research.md": (
                  "2026-08-26",
                  "《甲骨文合集》 이후의 주요 갑골 저록과 綴合 연구 자료를 재검토하여 목록의 오류와 누락을 교정하고 수록 범위를 정비하였다."
              ),
              "_posts/2026-08-27-Chinese-prosodic-syntax-introduction.md": (
                  "2026-08-27",
                  "통사와 운율을 독립된 층위로 보는 문제의식을 보강하고, 《孟子·滕文公上》의 然友之鄒問於孟子 / 然友復之鄒問孟子 대립을 추가하여 σ–ω–φ–ι에 따른 운율계층 분석을 도입하였다. 問於子貢의 운율구조도 [ω 問於] [ω 子貢]으로 수정하였다."
              ),
          }

          for filename, (date, text) in entries.items():
              path = Path(filename)
              content = path.read_text(encoding="utf-8").rstrip()
              if "\n## 개정 이력\n" in content:
                  continue
              content += f"\n\n## 개정 이력\n\n- **{date}** — {text}\n"
              path.write_text(content, encoding="utf-8")
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply revision histories to posts"
          git push origin HEAD:revision-history-audit-20260828
